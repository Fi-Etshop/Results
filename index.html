<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معهد في اتشوب لدراسة الكتاب المقدس</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
            direction: rtl;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8ddd4 100%);
            min-height: 100vh;
        }
        
        h1 {
            margin: 20px 0;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #752214;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h2 {
            margin: 30px 0 15px 0;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: #752214;
            border-bottom: 2px solid #752214;
            padding-bottom: 10px;
            position: relative;
        }

        h2:after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, #752214, #a03428);
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px auto;
            max-width: 500px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .logo {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin: 20px 0;
            border: 3px solid #752214;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }
        
        label {
            font-size: 18px;
            font-weight: bold;
            color: #752214;
            margin-bottom: 10px;
            display: block;
        }
        
        input {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 16px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #752214;
            background-color: white;
            box-shadow: 0 0 10px rgba(117, 34, 20, 0.2);
        }
        
        button {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #752214, #a03428);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        button:hover:before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(117, 34, 20, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-section {
            width: 100%;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 10px;
        }
        
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin: 20px 0;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: white;
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 600px;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
        }
        
        th, td {
            padding: 15px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
        }
        
        th {
            color: white;
            font-weight: bold;
            position: sticky;
            top: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            vertical-align: middle;
        }

        .grade-header {
            padding: 10px;
        }

        .grade-header .header-title {
            display: block;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .grade-header .max-grade {
            display: block;
            font-size: 0.9rem;
            font-weight: normal;
            opacity: 0.9;
            background: rgba(255,255,255,0.2);
            padding: 3px 8px;
            border-radius: 12px;
            margin: 0 auto;
            width: fit-content;
        }
        
        .term1-header {
            background: linear-gradient(135deg, #2e7d32, #4caf50);
        }
        
        .term2-header {
            background: linear-gradient(135deg, #1976d2, #2196f3);
        }
        
        .term3-header {
            background: linear-gradient(135deg, #f57c00, #ff9800);
        }
        
        .summary-header {
            background: linear-gradient(135deg, #752214, #a03428);
        }
        
        td {
            background-color: white;
            transition: background-color 0.3s ease;
        }
        
        tr:nth-child(even) td {
            background-color: #f9f9f9;
        }

        tr:hover td {
            background-color: #f0f8ff;
        }
        
        .hidden {
            display: none;
        }
        
        .error-message {
            color: #d32f2f;
            font-weight: bold;
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            border-radius: 10px;
            border: 1px solid #d32f2f;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .quote {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #752214;
            margin: 30px 20px;
            font-weight: bold;
            padding: 25px;
            background: linear-gradient(135deg, white, #fafafa);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-right: 5px solid #752214;
            font-style: italic;
        }
        
        .student-info {
            background: linear-gradient(135deg, white, #f8f9fa);
            padding: 25px;
            border-radius: 15px;
            margin: 20px auto;
            max-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-top: 4px solid #752214;
        }
        
        .student-info h3 {
            color: #752214;
            margin-top: 0;
            font-size: 1.4rem;
            text-align: center;
        }

        .student-info p {
            margin: 10px 0;
            font-size: 1.1rem;
            text-align: center;
        }

        .student-info strong {
            color: #752214;
        }
        
        .loading {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #752214;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            color: #2e7d32;
            font-weight: bold;
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(135deg, #e8f5e8, #c8e6c9);
            border-radius: 10px;
            border: 1px solid #2e7d32;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grade-cell {
            font-weight: bold;
        }

        .total-row {
            background: linear-gradient(135deg, #e8f5e8, #c8e6c9) !important;
            font-weight: bold;
            border-top: 2px solid #2e7d32;
        }

        .no-data-row {
            color: #666;
            font-style: italic;
            background: #f5f5f5 !important;
        }

        .warning-message {
            color: #f57c00;
            font-weight: bold;
            margin: 10px 0;
            padding: 10px;
            background: linear-gradient(135deg, #fff8e1, #ffecb3);
            border-radius: 8px;
            border: 1px solid #f57c00;
            font-size: 0.9rem;
        }
        
                .year-title {
            max-width: 1200px;
            margin: 50px auto 10px auto;
            padding: 14px 20px;
            font-size: clamp(1.3rem, 3.5vw, 2rem);
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #752214, #a03428);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .year-title:first-child {
            margin-top: 20px;
        }

        .year-note {
            max-width: 1200px;
            margin: 15px auto;
            padding: 15px 20px;
            color: #666;
            font-style: italic;
            background: #f5f5f5;
            border-radius: 10px;
            border: 1px dashed #bbb;
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
        }

        /* Mobile specific styles */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .container {
                margin: 10px;
                padding: 15px;
            }
            
            th, td {
                padding: 10px 6px;
                font-size: 13px;
            }

            .grade-header .header-title {
                font-size: 0.95rem;
            }

            .grade-header .max-grade {
                font-size: 0.8rem;
                padding: 2px 6px;
            }
            
            .logo {
                max-width: 250px;
            }
            
            .quote {
                margin: 20px 10px;
                padding: 20px;
                font-size: 16px;
            }

            .student-info {
                margin: 15px 5px;
                padding: 20px;
            }

            table {
                min-width: 500px;
            }
        }
        
        @media (max-width: 480px) {
            th, td {
                padding: 8px 4px;
                font-size: 12px;
            }

            .grade-header .header-title {
                font-size: 0.85rem;
            }

            .grade-header .max-grade {
                font-size: 0.7rem;
                padding: 2px 4px;
            }
            
            .table-container {
                margin: 15px -5px;
            }

            table {
                min-width: 400px;
            }

            .container {
                margin: 5px;
                padding: 10px;
            }
        }

        @media print {
            body {
                background: white;
            }
            
            .container {
                box-shadow: none;
            }
            
            button, input {
                display: none;
            }
            
            .table-container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <img src="logo.png" alt="شعار المعهد" class="logo" onerror="this.style.display='none'">
    <h1>نتيجة الطالب</h1>
    
    <div class="container">
        <label for="nationalID">الرقم القومي</label>
        <input type="text" id="nationalID" placeholder="أدخل الرقم القومي" maxlength="14">
        <button onclick="searchGrades()" id="searchButton">البحث عن النتيجة</button>
        <div id="loadingSpinner" class="loading hidden"></div>
        <div id="errorMessage" class="error-message hidden"></div>
        <div id="successMessage" class="success-message hidden"></div>
    </div>

    <!-- Student Info -->
    <div id="studentInfo" class="student-info hidden">
        <h3>معلومات الطالب</h3>
        <p><strong>الاسم:</strong> <span id="studentName"></span></p>
        <p><strong>الكود:</strong> <span id="studentCode"></span></p>
    </div>

    <div id="resultsSection" class="results-section hidden">
        <!-- يتم بناء نتائج السنتين هنا بالجافاسكريبت -->
        <div id="resultsContent"></div>
    </div>

    <div id="quote" class="quote hidden">
        نقرأ وندرس ... لنحيا ونكرز
    </div>

    <script>
        // حماية بسيطة من فتح أدوات المطورين
        document.addEventListener('keydown', function(e) {
            // منع F12
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // منع Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                e.preventDefault();
                return false;
            }
            // منع Ctrl+Shift+J
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                e.preventDefault();
                return false;
            }
            // منع Ctrl+U
            if (e.ctrlKey && e.keyCode === 85) {
                e.preventDefault();
                return false;
            }
        });

        // منع النقر بالزر الأيمن
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // Add Enter key support for input
        document.getElementById('nationalID').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchGrades();
            }
        });

        // Input validation - only numbers
        document.getElementById('nationalID').addEventListener('input', function(event) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Google Sheets CSV URL - غير هذا الرابط برابطك
        const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSc0_qiVsOcLNpoHugx3fa2ns9Lgm0xdZHIAFXt2xZkceZr2effIwP4wLNmkiswThzerVe8YhLoJauB/pub?output=csv";

        // رابط شيت درجات السنة الثانية (تاب منفصل منشور كـ CSV بنفس طريقة الرابط اللي فوق)
        // لو سبته فاضي هتظهر السنة الثانية "لم تُرصد الدرجات بعد" لكل الطلاب
        // ملحوظة: لو أضفت أعمدة السنة الثانية في الشيت الأساسي نفسه يشتغل برضه من غير الرابط ده
        const YEAR2_CSV_URL = "";

        // الأوزان: 25% حضور + 35% واجب + 40% فاينال
        const GRADE_WEIGHTS = { attendance: 0.25, assignment: 0.35, final: 0.40 };

        const FIELD_LABELS = {
            attendance: 'الحضور',
            assignment: 'الواجب',
            research: 'البحث',
            midterm: 'الميدترم',
            final: 'الفاينال'
        };

        // group = العنصر اللي بتتحسب فيه الخانة في ملخص السنة (حضور / واجب / فاينال)
        const YEARS = [
            {
                number: 1,
                name: 'السنة الأولى',
                hideEmptyTerms: false,
                emptyMessage: 'لا توجد نتيجة مسجلة للسنة الأولى',
                terms: [
                    { number: 1, name: 'الترم الأول', headerClass: 'term1-header', columns: [
                        { key: 'attendance', max: 14,  group: 'attendance' },
                        { key: 'assignment', max: 280, group: 'assignment' },
                        { key: 'research',   max: 10,  group: 'assignment' },
                        { key: 'midterm',    max: 40,  group: 'final' },
                        { key: 'final',      max: 50,  group: 'final' }
                    ]},
                    { number: 2, name: 'الترم الثاني', headerClass: 'term2-header', columns: [
                        { key: 'attendance', max: 8,   group: 'attendance' },
                        { key: 'assignment', max: 150, group: 'assignment' },
                        { key: 'final',      max: 50,  group: 'final' }
                    ]},
                    { number: 3, name: 'الترم الثالث', headerClass: 'term3-header', columns: [
                        { key: 'attendance', max: 7,   group: 'attendance' },
                        { key: 'assignment', max: 140, group: 'assignment' },
                        { key: 'final',      max: 50,  group: 'final' }
                    ]}
                ]
            },
            {
                number: 2,
                name: 'السنة الثانية',
                hideEmptyTerms: true,
                emptyMessage: 'لم تُرصد درجات السنة الثانية بعد',
                terms: [
                    { number: 1, name: 'الترم الأول', headerClass: 'term1-header', columns: [
                        { key: 'attendance', max: 7,   group: 'attendance' },
                        { key: 'assignment', max: 140, group: 'assignment' },
                        { key: 'research',   max: 10,  group: 'assignment' },
                        { key: 'final',      max: 50,  group: 'final' }
                    ]},
                    { number: 2, name: 'الترم الثاني', headerClass: 'term2-header', columns: [
                        { key: 'attendance', max: 6,   group: 'attendance' },
                        { key: 'assignment', max: 120, group: 'assignment' },
                        { key: 'final',      max: 50,  group: 'final' }
                    ]},
                    { number: 3, name: 'الترم الثالث', headerClass: 'term3-header', columns: [
                        { key: 'attendance', max: 5,   group: 'attendance' },
                        { key: 'assignment', max: 100, group: 'assignment' },
                        { key: 'final',      max: 50,  group: 'final' }
                    ]}
                ]
            }
        ];

        // تحليل CSV
        function parseCSV(csvText) {
            const rows = csvText.split("\n").map(row => {
                // التعامل مع الفواصل داخل الأقواس
                const cells = [];
                let currentCell = '';
                let insideQuotes = false;

                for (let i = 0; i < row.length; i++) {
                    const char = row[i];
                    if (char === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        cells.push(currentCell.trim());
                        currentCell = '';
                    } else {
                        currentCell += char;
                    }
                }
                cells.push(currentCell.trim());
                return cells;
            });

            const headers = rows[0];
            return rows.slice(1).map(row => {
                const student = {};
                row.forEach((value, index) => {
                    if (headers[index]) {
                        student[headers[index].trim()] = value.trim();
                    }
                });
                return student;
            }).filter(student => student["الرقم القومي"]); // فلترة الصفوف الفارغة
        }

        async function fetchSheet(url) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return parseCSV(await response.text());
        }

        // دالة جلب البيانات من Google Sheets (الشيت الأساسي + شيت السنة الثانية)
        async function fetchStudentData() {
            try {
                const [studentsData, year2Data] = await Promise.all([
                    fetchSheet(GOOGLE_SHEETS_CSV_URL),
                    YEAR2_CSV_URL ? fetchSheet(YEAR2_CSV_URL) : Promise.resolve([])
                ]);

                // دمج أعمدة السنة الثانية في بيانات الطالب بالرقم القومي
                if (year2Data.length > 0) {
                    const year2ByID = {};
                    year2Data.forEach(s => { year2ByID[s["الرقم القومي"]] = s; });

                    studentsData.forEach(student => {
                        const extra = year2ByID[student["الرقم القومي"]];
                        if (!extra) return;
                        Object.keys(extra).forEach(key => {
                            if (key.startsWith('السنة2_') || key.startsWith('y2_')) {
                                student[key] = extra[key];
                            }
                        });
                    });
                }

                return studentsData;
            } catch (error) {
                console.error('Error fetching data from Google Sheets:', error);
                throw error;
            }
        }

        // قراءة درجة واحدة (بالاسم الإنجليزي أو العربي)
        // السنة الأولى: term1_attendance أو الترم1_الحضور
        // السنة الثانية: y2_term1_attendance أو السنة2_الترم1_الحضور
        function getValue(student, year, term, key) {
            const label = FIELD_LABELS[key];
            const enKey = year.number === 1
                ? `term${term.number}_${key}`
                : `y${year.number}_term${term.number}_${key}`;
            const arKey = year.number === 1
                ? `الترم${term.number}_${label}`
                : `السنة${year.number}_الترم${term.number}_${label}`;
            return parseFloat(student[enKey] || student[arKey] || 0) || 0;
        }

        function weightedOf(att, asg, fin) {
            return att * GRADE_WEIGHTS.attendance + asg * GRADE_WEIGHTS.assignment + fin * GRADE_WEIGHTS.final;
        }

        // حساب نتيجة سنة كاملة: درجات وأنسبة كل ترم + متوسط السنة
        function evaluateYear(student, year) {
            const terms = year.terms.map(term => {
                const values = term.columns.map(col => getValue(student, year, term, col.key));
                const sums = { attendance: 0, assignment: 0, final: 0 };
                const maxes = { attendance: 0, assignment: 0, final: 0 };
                term.columns.forEach((col, i) => {
                    sums[col.group] += values[i];
                    maxes[col.group] += col.max;
                });

                const att = (sums.attendance / maxes.attendance) * 100;
                const asg = (sums.assignment / maxes.assignment) * 100;
                const fin = (sums.final / maxes.final) * 100;

                return {
                    term, values,
                    recorded: values.some(v => v > 0),
                    att, asg, fin,
                    weighted: weightedOf(att, asg, fin)
                };
            });

            const anyData = terms.some(t => t.recorded);
            // السنة الأولى: زي ما كانت (الترمات الثلاثة دايماً بتتحسب)
            // السنة الثانية: لازم الترمات الثلاثة يكون ليها درجات
            const complete = year.hideEmptyTerms ? terms.every(t => t.recorded) : anyData;

            let avg = null;
            if (complete) {
                const n = terms.length;
                const att = terms.reduce((s, t) => s + t.att, 0) / n;
                const asg = terms.reduce((s, t) => s + t.asg, 0) / n;
                const fin = terms.reduce((s, t) => s + t.fin, 0) / n;
                avg = { att, asg, fin, weighted: weightedOf(att, asg, fin) };
            }

            return { year, terms, anyData, complete, avg };
        }

        // دالة حساب التقدير بناءً على النسبة المئوية
        function getGrade(percentage) {
            if (percentage >= 85) {
                return { text: 'امتياز', class: 'grade-excellent' };
            } else if (percentage >= 75) {
                return { text: 'جيد جداً', class: 'grade-very-good' };
            } else if (percentage >= 65) {
                return { text: 'جيد', class: 'grade-good' };
            } else if (percentage >= 50) {
                return { text: 'مقبول', class: 'grade-acceptable' };
            } else {
                return { text: 'راسب', class: 'grade-fail' };
            }
        }

        // خلايا صف الملخص (حضور % ، واجب % ، فاينال % ، النسبة ، التقدير)
        function percentCells(p) {
            const weighted = p.weighted.toFixed(2);
            const grade = getGrade(parseFloat(weighted));
            return `
                        <td class="grade-cell">${p.att.toFixed(2)}%</td>
                        <td class="grade-cell">${p.asg.toFixed(2)}%</td>
                        <td class="grade-cell">${p.fin.toFixed(2)}%</td>
                        <td class="grade-cell">${weighted}%</td>
                        <td class="grade-cell ${grade.class}">${grade.text}</td>`;
        }

        function dashCells() {
            return '<td class="grade-cell">—</td>'.repeat(5);
        }

        // جدول درجات ترم واحد
        function renderTermTable(result, year) {
            const term = result.term;
            const headers = term.columns.map(col => `
                        <th class="grade-header">
                            <span class="header-title">${FIELD_LABELS[col.key]}</span>
                            <span class="max-grade">${col.max}</span>
                        </th>`).join('');
            const cells = result.values.map(v => `
                        <td class="grade-cell">${v}</td>`).join('');

            return `
        <h2>نتيجة ${term.name} - ${year.name}</h2>
        <div class="table-container">
            <table id="y${year.number}term${term.number}Table">
                <thead>
                    <tr class="${term.headerClass}">${headers}
                    </tr>
                </thead>
                <tbody>
                    <tr>${cells}
                    </tr>
                </tbody>
            </table>
        </div>`;
        }

        // ملخص السنة
        function renderYearSummary(res) {
            const year = res.year;
            let rows = '';

            res.terms.forEach(t => {
                if (year.hideEmptyTerms && !t.recorded) {
                    rows += `
                    <tr class="no-data-row">
                        <td>${t.term.name}</td>
                        <td colspan="5">لم تُرصد الدرجات بعد</td>
                    </tr>`;
                } else {
                    rows += `
                    <tr>
                        <td>${t.term.name}</td>${percentCells(t)}
                    </tr>`;
                }
            });

            rows += `
                    <tr class="total-row">
                        <td>إجمالي السنة</td>${res.complete ? percentCells(res.avg) : dashCells()}
                    </tr>`;

            const note = res.complete ? '' :
                `<div class="year-note">يظهر إجمالي السنة بعد اكتمال درجات الترمات الثلاثة</div>`;

            return `
        <h2>ملخص ${year.name}</h2>
        <div class="table-container">
            <table id="y${year.number}SummaryTable">
                <thead>
                    <tr class="summary-header">
                        <th>الترم</th>
                        <th>نسبة الحضور</th>
                        <th>نسبة الواجب</th>
                        <th>نسبة الفاينال</th>
                        <th>النسبة المئوية</th>
                        <th>التقدير</th>
                    </tr>
                </thead>
                <tbody>${rows}
                </tbody>
            </table>
        </div>${note}`;
        }

        // قسم السنة كامل: العنوان + كل ترم + الملخص
        function renderYear(res) {
            const year = res.year;
            let html = `
        <div class="year-title">${year.name}</div>`;

            if (!res.anyData) {
                return html + `
        <div class="year-note">${year.emptyMessage}</div>`;
            }

            res.terms.forEach(t => {
                if (year.hideEmptyTerms && !t.recorded) {
                    html += `
        <h2>نتيجة ${t.term.name} - ${year.name}</h2>
        <div class="year-note">لم تُرصد درجات هذا الترم بعد</div>`;
                } else {
                    html += renderTermTable(t, year);
                }
            });

            return html + renderYearSummary(res);
        }

        // ملخص السنتين على بعض
        function renderOverall(y1, y2) {
            // لو مفيش أي نتيجة مكتملة نخفي الجدول
            if (!y1.complete && !y2.complete) return '';

            let total = null;
            if (y1.complete && y2.complete) {
                const att = (y1.avg.att + y2.avg.att) / 2;
                const asg = (y1.avg.asg + y2.avg.asg) / 2;
                const fin = (y1.avg.fin + y2.avg.fin) / 2;
                total = { att, asg, fin, weighted: weightedOf(att, asg, fin) };
            }

            let note = '';
            if (!y1.complete) {
                note = 'لا يظهر إجمالي السنتين لعدم وجود نتيجة مسجلة للسنة الأولى';
            } else if (!y2.complete) {
                note = 'يظهر إجمالي السنتين بعد اكتمال درجات السنة الثانية';
            }

            return `
        <div class="year-title">السنتان معاً</div>
        <h2>ملخص السنتين</h2>
        <div class="table-container">
            <table id="overallTable">
                <thead>
                    <tr class="summary-header">
                        <th>السنة</th>
                        <th>نسبة الحضور</th>
                        <th>نسبة الواجب</th>
                        <th>نسبة الفاينال</th>
                        <th>النسبة المئوية</th>
                        <th>التقدير</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>السنة الأولى</td>${y1.complete ? percentCells(y1.avg) : dashCells()}
                    </tr>
                    <tr>
                        <td>السنة الثانية</td>${y2.complete ? percentCells(y2.avg) : dashCells()}
                    </tr>
                    <tr class="total-row">
                        <td>إجمالي السنتين</td>${total ? percentCells(total) : dashCells()}
                    </tr>
                </tbody>
            </table>
        </div>${note ? `
        <div class="year-note">${note}</div>` : ''}`;
        }

        function renderAllResults(student) {
            const y1 = evaluateYear(student, YEARS[0]);
            const y2 = evaluateYear(student, YEARS[1]);
            return renderYear(y1) + renderYear(y2) + renderOverall(y1, y2);
        }

        // دالة البحث عن الطالب
        async function searchGrades() {
            const nationalID = document.getElementById('nationalID').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const resultsSection = document.getElementById('resultsSection');
            const studentInfo = document.getElementById('studentInfo');
            const quote = document.getElementById('quote');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const searchButton = document.getElementById('searchButton');

            // مسح النتائج السابقة
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            resultsSection.classList.add('hidden');
            studentInfo.classList.add('hidden');
            quote.classList.add('hidden');
            document.getElementById('resultsContent').innerHTML = '';

            // التحقق من صحة المدخل
            if (!nationalID) {
                showError("برجاء إدخال الرقم القومي");
                return;
            }

            if (nationalID.length !== 14) {
                showError("الرقم القومي يجب أن يكون 14 رقم");
                return;
            }

            // عرض مؤشر التحميل
            loadingSpinner.classList.remove('hidden');
            searchButton.disabled = true;
            searchButton.textContent = 'جاري البحث...';

            try {
                // جلب بيانات الطلاب
                const studentsData = await fetchStudentData();
                
                // البحث عن الطالب
                const student = studentsData.find(s => s["الرقم القومي"] === nationalID);

                // إخفاء مؤشر التحميل
                loadingSpinner.classList.add('hidden');
                searchButton.disabled = false;
                searchButton.textContent = 'البحث عن النتيجة';

                if (!student) {
                    showError("الرقم القومي الذي أدخلته خطأ أو لا توجد نتائج متاحة");
                    return;
                }

                // التحقق من حالة دفع المصاريف
                const paymentStatus = student["حالة الدفع"] || student["payment_status"] || "";
                if (paymentStatus.toLowerCase() !== "مدفوع" && paymentStatus.toLowerCase() !== "paid") {
                    showPaymentError();
                    return;
                }

                // عرض معلومات الطالب
                document.getElementById('studentName').textContent = student["الاسم"] || "غير محدد";
                document.getElementById('studentCode').textContent = student["الكود"] || "غير محدد";
                studentInfo.classList.remove('hidden');

                // عرض نتائج السنتين
                document.getElementById('resultsContent').innerHTML = renderAllResults(student);

                resultsSection.classList.remove('hidden');
                quote.classList.remove('hidden');
                
                showSuccess("تم العثور على النتائج بنجاح!");

                // Scroll to results
                setTimeout(() => {
                    studentInfo.scrollIntoView({ behavior: 'smooth' });
                }, 500);

            } catch (error) {
                loadingSpinner.classList.add('hidden');
                searchButton.disabled = false;
                searchButton.textContent = 'البحث عن النتيجة';
                showError("حدث خطأ في الاتصال بقاعدة البيانات. برجاء المحاولة مرة أخرى");
                console.error('Error:', error);
            }
        }
        
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            
            // إخفاء رسالة الخطأ بعد 5 ثواني
            setTimeout(() => {
                errorMessage.classList.add('hidden');
            }, 5000);
        }

        function showSuccess(message) {
            const successMessage = document.getElementById('successMessage');
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            
            // إخفاء رسالة النجاح بعد 3 ثواني
            setTimeout(() => {
                successMessage.classList.add('hidden');
            }, 3000);
        }

        function showPaymentError() {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.innerHTML = `
                <div style="text-align: center;">
                    <h3 style="color: #d32f2f; margin-top: 0;">⚠️ تنبيه مهم ⚠️</h3>
                    <p style="font-size: 16px; margin: 15px 0;">عذراً، لا يمكن عرض النتيجة حاليًا</p>
                    <p style="font-size: 14px; color: #666;">تم حجب النتيجة لعدم استكمال مصروفات العام الدراسي</p>
                    <div style="margin-top: 20px; padding: 10px; background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 8px;">
                        <p style="margin: 0; font-size: 13px; color: #856404;">
                            للاستفسار (واتساب فقط) : 01555981300<br>
                            للدفع : https://ipn.eg/S/samirkamalghaly/instapay/9Ys2lv
                        </p>
                    </div>
                </div>
            `;
            errorMessage.classList.remove('hidden');
        }
    </script>
